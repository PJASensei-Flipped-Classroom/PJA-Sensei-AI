  /conversations/{conversation_id}/prelab:
    get:
      summary: "Get Prelab"
      operationId: "get_prelab_conversations__conversation_id__prelab_get"
      security:
        -
          HTTPBearer:

      parameters:
        -
          name: "conversation_id"
