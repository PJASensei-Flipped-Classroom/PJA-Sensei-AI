      parameters:
        -
          name: "conversation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Conversation Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreLabSubmitRequest"
      responses:
        200:
          description: "Successful Response"
