            application/json:
              schema:

        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /conversations/{conversation_id}/messages/stream:
    post:
      summary: "Send Message Stream"
      operationId: "send_message_stream_conversations__conversation_id__messages_stream_post"
      security:
        -
          HTTPBearer:

      parameters:
        -
          name: "conversation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Conversation Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema:

        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /conversations/{conversation_id}/messages/{message_id}/regenerate:
    post:
      summary: "Regenerate Message"
      operationId: "regenerate_message_conversations__conversation_id__messages__message_id__regenerate_post"
      security:
        -
          HTTPBearer:

      parameters:
        -
          name: "conversation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Conversation Id"
        -
          name: "message_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Message Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /conversations/{conversation_id}/hints/reveal:
    post:
      summary: "Reveal Hint"
      operationId: "reveal_hint_conversations__conversation_id__hints_reveal_post"
      security:
        -
          HTTPBearer:

      parameters:
        -
          name: "conversation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Conversation Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealHintRequest"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema:

        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /conversations/{conversation_id}/messages/{message_id}/feedback:
    post:
      summary: "Rate Message"
      operationId: "rate_message_conversations__conversation_id__messages__message_id__feedback_post"
      security:
        -
          HTTPBearer:

      parameters:
        -
          name: "conversation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Conversation Id"
        -
          name: "message_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Message Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema:

        422:
