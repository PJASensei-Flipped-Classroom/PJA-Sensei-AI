          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /conversations/{conversation_id}/summary:
    post:
      summary: "Get Summary"
      operationId: "get_summary_conversations__conversation_id__summary_post"
      security:
        -
          HTTPBearer:

      parameters:
        -
          name: "conversation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Conversation Id"
      responses:
        200:
          description: "Successful Response"
          content:
            application/json:
              schema:

        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    AgentBehavior:
      properties:
        persona:
          $ref: "#/components/schemas/AgentPersona"
        codeRevealFallback:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Coderevealfallback"
        strictRules:
          items:
            type: "string"
          type: "array"
          title: "Strictrules"
        model:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Model"
        mode:
          type: "string"
          enum:
            - "theory"
            - "debug"
            - "review"
          title: "Mode"
          default: "debug"
      type: "object"
      required:
        - "persona"
        - "strictRules"
      title: "AgentBehavior"
    AgentPersona:
      properties:
        role:
          type: "string"
          title: "Role"
        tone:
          type: "string"
          title: "Tone"
      type: "object"
      required:
        - "role"
        - "tone"
      title: "AgentPersona"
    Checkpoint:
      properties:
        id:
          type: "string"
          title: "Id"
        after_goal:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "After Goal"
        hint:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Hint"
      type: "object"
      required:
        - "id"
      title: "Checkpoint"
    CodeContext:
      properties:
        current_file_name:
          type: "string"
          title: "Current File Name"
        current_code:
          type: "string"
          title: "Current Code"
        error_logs:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Error Logs"
        workspace_root:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Workspace Root"
        selection:
          anyOf:
            -
              $ref: "#/components/schemas/CodeSelection"
            -
              type: "null"
        diagnostics:
          items:
            $ref: "#/components/schemas/DiagnosticItem"
          type: "array"
          title: "Diagnostics"
        open_files:
          items:
            $ref: "#/components/schemas/OpenFile"
          type: "array"
          title: "Open Files"
      type: "object"
      required:
        - "current_file_name"
        - "current_code"
      title: "CodeContext"
    CodeSelection:
      properties:
        start_line:
          type: "integer"
          title: "Start Line"
        end_line:
          type: "integer"
          title: "End Line"
        text:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Text"
      type: "object"
      required:
        - "start_line"
        - "end_line"
      title: "CodeSelection"
    DebugInfo:
      properties:
        is_frustrated:
          type: "boolean"
          title: "Is Frustrated"
        avg_score:
          type: "number"
          title: "Avg Score"
        code_changed:
          type: "boolean"
          title: "Code Changed"
      type: "object"
      required:
        - "is_frustrated"
        - "avg_score"
        - "code_changed"
      title: "DebugInfo"
    DiagnosticItem:
      properties:
        file:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "File"
        severity:
          type: "string"
          enum:
            - "error"
            - "warning"
            - "info"
            - "hint"
          title: "Severity"
          default: "error"
        message:
          type: "string"
          title: "Message"
        line:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          title: "Line"
        source:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Source"
      type: "object"
      required:
        - "message"
      title: "DiagnosticItem"
    FeedbackRequest:
      properties:
        rating:
          type: "integer"
          title: "Rating"
        comment:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Comment"
      type: "object"
      required:
        - "rating"
      title: "FeedbackRequest"
    GoalProgressItem:
      properties:
        goal:
          type: "string"
          title: "Goal"
        status:
          type: "string"
          enum:
            - "not_started"
            - "in_progress"
            - "done"
          title: "Status"
          default: "not_started"
      type: "object"
      required:
        - "goal"
      title: "GoalProgressItem"
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: "array"
          title: "Detail"
      type: "object"
      title: "HTTPValidationError"
    IdeEventRequest:
      properties:
        type:
          type: "string"
          enum:
            - "copy_blocked"
            - "file_opened"
            - "paste_attempt"
          title: "Type"
        meta:
          additionalProperties: true
          type: "object"
          title: "Meta"
      type: "object"
      required:
        - "type"
      title: "IdeEventRequest"
    IdeRestrictions:
      properties:
        requireFileContextForChat:
          type: "boolean"
          title: "Requirefilecontextforchat"
          default: false
        disableCopyFromChat:
          type: "boolean"
          title: "Disablecopyfromchat"
          default: false
      type: "object"
      title: "IdeRestrictions"
    LearningContext:
      properties:
        goals:
          items:
            type: "string"
          type: "array"
          title: "Goals"
        referenceMaterials:
          items:
            $ref: "#/components/schemas/ReferenceMaterial"
          type: "array"
          title: "Referencematerials"
      type: "object"
      required:
        - "goals"
        - "referenceMaterials"
      title: "LearningContext"
    MessageRequest:
      properties:
        question:
          type: "string"
          title: "Question"
        code_context:
          $ref: "#/components/schemas/CodeContext"
        client_message_id:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Client Message Id"
      type: "object"
      required:
        - "question"
        - "code_context"
      title: "MessageRequest"
    MessageResponse:
      properties:
        message_id:
          type: "string"
          title: "Message Id"
        answer:
          type: "string"
          title: "Answer"
        prompt_score:
          type: "integer"
          title: "Prompt Score"
        prompt_feedback:
          type: "string"
          title: "Prompt Feedback"
        tokens_used:
          type: "integer"
          title: "Tokens Used"
        is_cached:
          type: "boolean"
          title: "Is Cached"
          default: false
        penalty_applied:
          type: "boolean"
          title: "Penalty Applied"
          default: false
        sources:
          items:
            $ref: "#/components/schemas/SourceRef"
          type: "array"
          title: "Sources"
        suggested_next_step:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Suggested Next Step"
        goal_progress:
          items:
            $ref: "#/components/schemas/GoalProgressItem"
          type: "array"
          title: "Goal Progress"
        debug_info:
          anyOf:
            -
              $ref: "#/components/schemas/DebugInfo"
            -
              type: "null"
        client_message_id:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Client Message Id"
      type: "object"
      required:
        - "answer"
        - "prompt_score"
        - "prompt_feedback"
        - "tokens_used"
      title: "MessageResponse"
    OpenFile:
      properties:
        path:
          type: "string"
          title: "Path"
        content:
          type: "string"
          title: "Content"
        language:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Language"
      type: "object"
      required:
        - "path"
        - "content"
      title: "OpenFile"
    PreLabAnswerItem:
      properties:
        id:
          type: "string"
          title: "Id"
        answer:
          type: "string"
          title: "Answer"
      type: "object"
      required:
        - "id"
        - "answer"
      title: "PreLabAnswerItem"
    PreLabConfig:
      properties:
        enabled:
          type: "boolean"
          title: "Enabled"
          default: false
        questions:
          items:
