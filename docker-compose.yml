services:
  ai-module:
    build: .
    ports:
      # Lab default: loopback only — do not expose unauthenticated AI on LAN/cloud.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      AI_AUTH_ENABLED: "false"
      SECURITY_FAIL_CLOSED: "false"
      TRUST_X_FORWARDED_FOR: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
